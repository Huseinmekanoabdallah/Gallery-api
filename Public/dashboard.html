<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery API – Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: rgba(79, 70, 229, 0.08); transform: translateX(4px); }
        .sidebar-item.active { background: rgba(79, 70, 229, 0.12); color: #4F46E5; font-weight: 600; }
        .gallery-card { transition: transform 0.2s, box-shadow 0.2s; }
        .gallery-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .gallery-card img { aspect-ratio: 1/1; object-fit: cover; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 9999px; object-fit: cover; border: 4px solid #4F46E5; }
        .avatar-small { width: 36px; height: 36px; border-radius: 9999px; object-fit: cover; border: 2px solid #4F46E5; }
        .default-avatar {
            width: 100px;
            height: 100px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 4px solid #4F46E5;
            flex-shrink: 0;
        }
        .default-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 2px solid #4F46E5;
            flex-shrink: 0;
        }
        .glass-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); }
        .btn:active { transform: scale(0.96); }
        .toast { transition: all 0.3s ease; }
        .toast.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
        .toast-light {
            background: white !important;
            color: #1f2937 !important;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05) !important;
        }
        .toast-light i { color: #10b981 !important; }
        .toast-light.error i { color: #ef4444 !important; }
        .toast-light.error { border-color: #fecaca !important; }
        body { background: linear-gradient(145deg, #f0f4ff 0%, #e6edf9 100%); min-height: 100vh; }
        .container-custom { max-width: 1200px; margin: 0 auto; }
        .sidebar-overlay { display: none; }
        @media (max-width: 768px) {
            .sidebar-overlay.active { display: block; }
            .sidebar-mobile { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar-mobile.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

<!-- ========== MOBILE SIDEBAR OVERLAY ========== -->
<div id="sidebarOverlay" class="sidebar-overlay fixed inset-0 bg-black/50 z-40" onclick="toggleSidebar()"></div>

<!-- ========== SIDEBAR ========== -->
<aside id="sidebar" class="sidebar-mobile fixed top-0 left-0 w-64 h-full bg-white/95 backdrop-blur-sm border-r border-gray-200 flex flex-col py-6 px-4 z-50 transition-transform duration-300">
    <div class="flex items-center justify-between px-2 mb-8">
        <div class="flex items-center gap-3">
            <span class="text-3xl">📸</span>
            <div>
                <h1 class="text-xl font-bold text-gray-800">Gallery<span class="text-indigo-600">API</span></h1>
                <p class="text-xs text-gray-500">Developer Console</p>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-700 text-xl">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <nav class="flex-1 space-y-1">
        <a href="#profile" class="sidebar-item active flex items-center gap-3 px-4 py-2.5 rounded-lg text-indigo-600 font-semibold" onclick="scrollToSection('profile')">
            <i class="fas fa-user-circle w-5 text-center"></i> Profile
        </a>
        <a href="#upload" class="sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:text-indigo-600" onclick="scrollToSection('upload')">
            <i class="fas fa-cloud-upload-alt w-5 text-center"></i> Upload
        </a>
        <a href="#gallery" class="sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:text-indigo-600" onclick="scrollToSection('gallery')">
            <i class="fas fa-images w-5 text-center"></i> My Gallery
        </a>
    </nav>
    <div class="border-t border-gray-200 pt-4">
        <button onclick="logout()" class="sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-red-500 hover:bg-red-50 w-full">
            <i class="fas fa-sign-out-alt w-5 text-center"></i> Logout
        </button>
    </div>
</aside>

<!-- ========== MAIN CONTENT ========== -->
<main class="md:ml-64 min-h-screen p-4 sm:p-6">
    <div class="container-custom">

        <!-- ========== TOP BAR ========== -->
        <header class="glass-card rounded-2xl shadow-sm p-3 sm:p-4 flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 flex-1">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-800 text-xl">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="relative flex-1 max-w-xs sm:max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search gallery..." class="w-full pl-10 pr-4 py-2 bg-white/70 border border-gray-200 rounded-full focus:ring-2 focus:ring-indigo-400 focus:outline-none text-sm" onkeyup="loadGallery(1)" />
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="userName" class="text-sm font-medium text-gray-700 hidden sm:inline">User</span>
                <div id="avatarSmallContainer" class="w-9 h-9"></div>
                <button onclick="logout()" class="text-sm text-red-500 hover:text-red-600 font-medium hidden sm:inline">Logout</button>
            </div>
        </header>

        <!-- ========== PROFILE SECTION ========== -->
        <section id="profile" class="glass-card rounded-2xl shadow-sm p-4 sm:p-6 mb-6">
            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6">
                <div class="relative">
                    <div id="avatarLargeContainer"></div>
                    <button onclick="document.getElementById('avatarInput').click()" class="absolute bottom-0 right-0 bg-indigo-600 text-white p-2 rounded-full shadow-lg hover:bg-indigo-700 transition">
                        <i class="fas fa-camera text-sm"></i>
                    </button>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar()" />
                </div>
                <div class="flex-1 text-center sm:text-left">
                    <h2 class="text-2xl font-bold text-gray-800" id="profileUsername">Username</h2>
                    <p class="text-gray-600" id="profileEmail">email@example.com</p>
                    <div class="flex flex-wrap justify-center sm:justify-start gap-2 mt-3">
                        <button onclick="document.getElementById('avatarInput').click()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 text-sm font-medium transition">Upload Avatar</button>
                        <button onclick="deleteAvatar()" class="px-4 py-2 bg-red-100 text-red-700 rounded-xl hover:bg-red-200 text-sm font-medium transition">Delete Avatar</button>
                    </div>
                    <div id="avatarMessage" class="mt-2 text-sm"></div>
                </div>
            </div>
        </section>

        <!-- ========== UPLOAD SECTION ========== -->
        <section id="upload" class="glass-card rounded-2xl shadow-sm p-4 sm:p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2 mb-4">
                <i class="fas fa-cloud-upload-alt text-indigo-500"></i> Upload Images
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-2">
                    <input type="file" id="galleryInput" accept="image/*" multiple class="w-full px-4 py-2 border border-gray-300 rounded-xl bg-white/70" />
                </div>
                <input type="text" id="captionsInput" placeholder="Captions (comma separated)" class="px-4 py-2 border border-gray-300 rounded-xl bg-white/70" />
            </div>
            <button onclick="uploadGallery()" class="mt-3 px-6 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition font-medium flex items-center gap-2">
                <i class="fas fa-upload"></i> Upload
            </button>
            <div id="uploadMessage" class="mt-2 text-sm"></div>
        </section>

        <!-- ========== GALLERY SECTION ========== -->
        <section id="gallery" class="glass-card rounded-2xl shadow-sm p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-images text-indigo-500"></i> My Gallery
                </h2>
                <button onclick="loadGallery(1)" class="px-4 py-2 bg-gray-200 rounded-xl hover:bg-gray-300 transition text-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div id="galleryContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="paginationContainer" class="flex justify-center items-center gap-3 mt-6 flex-wrap"></div>
        </section>

    </div>
</main>

<!-- ========== TOAST ========== -->
<div id="toast" class="toast hidden fixed bottom-4 right-4 sm:bottom-6 sm:right-6 px-4 py-3 sm:px-6 sm:py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 toast-light max-w-xs sm:max-w-md">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage" class="text-sm sm:text-base">Success!</span>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API = 'http://localhost:4000/api';
    let token = localStorage.getItem('token');
    let currentPage = 1;
    let currentSearch = '';
    const limit = 6;

    // ============================================================
    // HELPERS
    // ============================================================
    function getHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
    }

    function getFormDataHeaders() {
        return {
            'Authorization': `Bearer ${token}`
        };
    }

    // ============================================================
    // SIDEBAR TOGGLE
    // ============================================================
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    // ============================================================
    // DEFAULT AVATAR
    // ============================================================
    function getInitials(username) {
        if (!username) return '?';
        const parts = username.split(' ');
        if (parts.length >= 2) {
            return (parts[0][0] + parts[1][0]).toUpperCase();
        }
        return username.substring(0, 2).toUpperCase();
    }

    function renderDefaultAvatar(containerId, username, size = 'large') {
        const container = document.getElementById(containerId);
        if (!container) return;
        const initials = getInitials(username);
        const isSmall = size === 'small';
        container.innerHTML = `
            <div class="${isSmall ? 'default-avatar-small' : 'default-avatar'}">
                ${initials}
            </div>
        `;
    }

    function renderAvatar(containerId, avatarUrl, username, size = 'large') {
        const container = document.getElementById(containerId);
        if (!container) return;
        if (avatarUrl) {
            const imgClass = size === 'small' ? 'avatar-small' : 'avatar-preview';
            container.innerHTML = `<img src="${avatarUrl}" alt="Avatar" class="${imgClass}" />`;
        } else {
            renderDefaultAvatar(containerId, username, size);
        }
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = msg;
        toast.className = 'toast fixed bottom-4 right-4 sm:bottom-6 sm:right-6 px-4 py-3 sm:px-6 sm:py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 toast-light max-w-xs sm:max-w-md';
        if (isError) {
            toast.classList.add('error');
        }
        setTimeout(() => { toast.classList.add('hidden'); }, 3000);
    }

    function showMessage(el, msg, isError = false) {
        const colors = isError ? 'bg-red-100 border-red-300 text-red-700' : 'bg-green-100 border-green-300 text-green-700';
        el.innerHTML = `<div class="p-3 rounded-xl border ${colors}">${msg}</div>`;
        setTimeout(() => el.innerHTML = '', 5000);
    }

    // ============================================================
    // AUTH CHECK
    // ============================================================
    if (!token) {
        window.location.href = 'login.html';
    }

    // ============================================================
    // SCROLL TO SECTION
    // ============================================================
    function scrollToSection(sectionId) {
        document.querySelectorAll('.sidebar-item').forEach(el => {
            el.classList.remove('active', 'text-indigo-600', 'font-semibold');
            el.classList.add('text-gray-600');
        });
        const clickedItem = document.querySelector(`.sidebar-item[href="#${sectionId}"]`);
        if (clickedItem) {
            clickedItem.classList.add('active', 'text-indigo-600', 'font-semibold');
            clickedItem.classList.remove('text-gray-600');
        }
        const section = document.getElementById(sectionId);
        if (section) {
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        if (window.innerWidth < 768) {
            toggleSidebar();
        }
    }

    // ============================================================
    // PROFILE
    // ============================================================
    async function loadProfile() {
        try {
            const res = await fetch(`${API}/profile`, { headers: getHeaders() });
            const data = await res.json();
            if (res.ok) {
                const username = data.username;
                const email = data.email;
                const avatarUrl = data.avatar_url ? `http://localhost:4000${data.avatar_url}` : null;
                document.getElementById('profileUsername').textContent = username;
                document.getElementById('profileEmail').textContent = email;
                document.getElementById('userName').textContent = username;
                renderAvatar('avatarLargeContainer', avatarUrl, username, 'large');
                renderAvatar('avatarSmallContainer', avatarUrl, username, 'small');
            } else if (res.status === 401) {
                logout();
            }
        } catch (err) { console.error(err); }
    }

    async function uploadAvatar() {
        const fileInput = document.getElementById('avatarInput');
        const file = fileInput.files[0];
        const msg = document.getElementById('avatarMessage');
        if (!file) return showMessage(msg, 'Select an image', true);
        const form = new FormData();
        form.append('avatar', file);
        try {
            const res = await fetch(`${API}/upload/avatar`, {
                method: 'POST',
                headers: getFormDataHeaders(),
                body: form
            });
            const data = await res.json();
            if (res.ok) {
                showMessage(msg, '✅ Avatar updated');
                fileInput.value = '';
                loadProfile();
            } else {
                showMessage(msg, '❌ ' + (data.error || 'Upload failed'), true);
            }
        } catch (err) {
            showMessage(msg, '❌ Network error', true);
        }
    }

    async function deleteAvatar() {
        if (!confirm('Delete your avatar?')) return;
        const msg = document.getElementById('avatarMessage');
        try {
            const res = await fetch(`${API}/avatar`, { method: 'DELETE', headers: getHeaders() });
            if (res.ok) {
                showMessage(msg, '✅ Avatar removed');
                loadProfile();
            } else {
                showMessage(msg, '❌ Delete failed', true);
            }
        } catch (err) {
            showMessage(msg, '❌ Network error', true);
        }
    }

    // ============================================================
    // GALLERY UPLOAD - Send captions as JSON string
    // ============================================================
    async function uploadGallery() {
        const files = document.getElementById('galleryInput').files;
        const captionsText = document.getElementById('captionsInput').value.trim();
        const msg = document.getElementById('uploadMessage');
        if (!files.length) return showMessage(msg, 'Select at least one image', true);

        const form = new FormData();
        for (let f of files) form.append('images', f);

        // ✅ Send captions as a JSON array string
        // Your backend parses this as an array
        if (captionsText) {
            const captions = captionsText.split(',').map(s => s.trim()).filter(s => s);
            form.append('captions', JSON.stringify(captions));
        } else {
            form.append('captions', JSON.stringify([]));
        }

        try {
            const res = await fetch(`${API}/upload/gallery`, {
                method: 'POST',
                headers: getFormDataHeaders(),
                body: form
            });
            const data = await res.json();
            if (res.ok) {
                showMessage(msg, `✅ ${data.images?.length || 0} images uploaded`);
                document.getElementById('galleryInput').value = '';
                document.getElementById('captionsInput').value = '';
                loadGallery(1);
            } else {
                showMessage(msg, '❌ ' + (data.error || 'Upload failed'), true);
            }
        } catch (err) {
            showMessage(msg, data.message || '❌ Network error', true);
        }
    }

    // ============================================================
    // GALLERY DISPLAY
    // ============================================================
    async function loadGallery(page = 1) {
        currentPage = page;
        currentSearch = document.getElementById('searchInput').value.trim();
        const container = document.getElementById('galleryContainer');
        const pagination = document.getElementById('paginationContainer');
        try {
            const url = `${API}/gallery?page=${page}&limit=${limit}${currentSearch ? '&search=' + encodeURIComponent(currentSearch) : ''}`;
            const res = await fetch(url, { headers: getHeaders() });
            const data = await res.json();
            if (!res.ok) {
                container.innerHTML = `<div class="col-span-full text-center text-red-600 py-8">❌ ${data.error || 'Failed'}</div>`;
                return;
            }
            if (!data.data || data.data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-8"><i class="fas fa-images text-4xl block mb-2 text-gray-300"></i>No images yet. Upload some!</div>`;
                pagination.innerHTML = '';
                return;
            }
            let html = '';
            data.data.forEach(img => {
                const url = `http://localhost:4000${img.image_url}`;
                const captionText = img.captions || img.caption || 'No caption';
                html += `
                    <div class="gallery-card bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
                        <img src="${url}" alt="${captionText}" class="w-full h-56 object-cover" />
                        <div class="p-3">
                            <p class="text-gray-800 font-medium truncate">${captionText}</p>
                            <p class="text-xs text-gray-400 mt-0.5">${new Date(img.created_at).toLocaleDateString()}</p>
                            <div class="mt-2 flex gap-1">
                                <input type="text" id="editInput-${img.id}" placeholder="New caption" class="flex-1 px-2 py-1 border border-gray-300 rounded-lg text-sm" />
                                <button onclick="updateCaption(${img.id})" class="px-3 py-1 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 text-xs transition">Save</button>
                            </div>
                            <button onclick="deleteGalleryImage(${img.id})" class="mt-2 w-full px-3 py-1.5 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition text-sm flex items-center justify-center gap-1">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            const total = data.totalPages || 1;
            pagination.innerHTML = `
                <button onclick="loadGallery(${page - 1})" ${page <= 1 ? 'disabled' : ''} class="px-4 py-2 bg-gray-200 rounded-xl hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition">‹ Prev</button>
                <span class="px-4 py-2 bg-white rounded-xl shadow-sm text-gray-700">${page} / ${total}</span>
                <button onclick="loadGallery(${page + 1})" ${page >= total ? 'disabled' : ''} class="px-4 py-2 bg-gray-200 rounded-xl hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition">Next ›</button>
            `;
        } catch (err) {
            container.innerHTML = `<div class="col-span-full text-center text-red-600 py-8">❌ Network error</div>`;
        }
    }

    // ============================================================
    // UPDATE CAPTION
    // ============================================================
    async function updateCaption(id) {
        const input = document.getElementById(`editInput-${id}`);
        const caption = input.value.trim();
        if (!caption) return showToast('Please enter a caption', true);
        try {
            const res = await fetch(`${API}/gallery/${id}`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify({ captions: caption })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('✅ Caption updated!');
                loadGallery(currentPage);
            } else {
                showToast('❌ ' + (data.error || 'Update failed'), true);
            }
        } catch (err) {
            showToast('❌ Network error', true);
        }
    }

    // ============================================================
    // DELETE GALLERY IMAGE
    // ============================================================
    async function deleteGalleryImage(id) {
        if (!confirm('Delete this image?')) return;
        try {
            const res = await fetch(`${API}/gallery/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (res.ok) {
                loadGallery(currentPage);
            } else {
                showToast('Delete failed', true);
            }
        } catch (err) {
            showToast('Network error', true);
        }
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    // ============================================================
    // INIT
    // ============================================================
    loadProfile();
    loadGallery(1);

    window.uploadAvatar = uploadAvatar;
    window.deleteAvatar = deleteAvatar;
    window.uploadGallery = uploadGallery;
    window.loadGallery = loadGallery;
    window.updateCaption = updateCaption;
    window.deleteGalleryImage = deleteGalleryImage;
    window.logout = logout;
    window.scrollToSection = scrollToSection;
    window.toggleSidebar = toggleSidebar;
</script>

</body>
</html>
