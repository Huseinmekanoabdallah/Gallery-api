<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-4">
    <div class="w-full max-w-md bg-white/70 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/30 p-8">
        <div class="text-center">
            <span class="text-4xl">📸</span>
            <h1 class="text-3xl font-extrabold text-gray-800 mt-1">Gallery<span class="text-indigo-600">API</span></h1>
            <p class="text-sm text-gray-500 mt-1">Create your free account</p>
        </div>
        <form id="signupForm" class="mt-6 space-y-4">
            <input type="text" id="signupUsername" placeholder="Username" required class="w-full px-4 py-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none transition">
            <input type="email" id="signupEmail" placeholder="Email address" required class="w-full px-4 py-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none transition">
            <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6" class="w-full px-4 py-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none transition">
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition duration-150 active:scale-95">Create Account</button>
        </form>
        <div id="signupMessage" class="mt-3 text-sm"></div>
        <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Log in</a></p>
    </div>
    <script>
        const API = '/api';
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const msg = document.getElementById('signupMessage');
            try {
                const res = await fetch(`${API}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.innerHTML = `<div class="bg-green-100 border border-green-300 text-green-700 px-4 py-2 rounded-xl">✅ Account created! <a href="login.html" class="font-semibold text-indigo-600">Log in now</a></div>`;
                    document.getElementById('signupForm').reset();
                } else {
                    msg.innerHTML = `<div class="bg-red-100 border border-red-300 text-red-700 px-4 py-2 rounded-xl">❌ ${data.error || 'Signup failed'}</div>`;
                }
            } catch {
                msg.innerHTML = `<div class="bg-red-100 border border-red-300 text-red-700 px-4 py-2 rounded-xl">❌ Network error</div>`;
            }
        });
    </script>
</body>
</html>
