<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-4">
    <div class="w-full max-w-md bg-white/70 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/30 p-8">
        <div class="text-center">
            <span class="text-4xl">📸</span>
            <h1 class="text-3xl font-extrabold text-gray-800 mt-1">Gallery<span class="text-indigo-600">API</span></h1>
            <p class="text-sm text-gray-500 mt-1">Welcome back</p>
        </div>
        <form id="loginForm" class="mt-6 space-y-4">
            <input type="email" id="loginEmail" placeholder="Email address" required class="w-full px-4 py-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none transition">
            <input type="password" id="loginPassword" placeholder="Password" required class="w-full px-4 py-3 bg-white/70 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none transition">
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition duration-150 active:scale-95">Log In</button>
        </form>
        <div id="loginMessage" class="mt-3 text-sm"></div>
        <p class="text-center text-sm text-gray-500 mt-6">Don't have an account? <a href="signup.html" class="text-indigo-600 font-semibold hover:underline">Sign up</a></p>
    </div>
    <script>
        // ✅ Correct API URL for Render deployment
        const API = '/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMessage');

            if (!email || !password) {
                msg.innerHTML = `<div class="bg-red-100 border border-red-300 text-red-700 px-4 py-2 rounded-xl">Please fill in all fields</div>`;
                return;
            }

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    msg.innerHTML = `<div class="bg-red-100 border border-red-300 text-red-700 px-4 py-2 rounded-xl">❌ ${data.error || 'Login failed'}</div>`;
                }
            } catch (error) {
                console.error('Login error:', error);
                msg.innerHTML = `<div class="bg-red-100 border border-red-300 text-red-700 px-4 py-2 rounded-xl">❌ Network error. Please try again.</div>`;
            }
        });
    </script>
</body>
</html>
